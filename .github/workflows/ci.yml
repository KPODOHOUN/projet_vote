name: CI

# ADR-007 decides on GitHub Actions CI but none existed until this workflow —
# see the technical-health audit (2026-09-06): 7 of 50 API test files,
# including two security suites, were silently absent from `npm test`'s
# hardcoded file list with nothing to catch it. This workflow is that catch.

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_ENV: test
  MAIL_RESEND_API_KEY: ""
  DATABASE_URL: "postgresql://votezpro:votezpro_dev@localhost:5433/votezpro_test"
  TEST_DATABASE_URL: "postgresql://votezpro:votezpro_dev@localhost:5433/votezpro_test"

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema packages/db/prisma/schema.prisma

      - name: Build shared/db packages (apps/api and apps/web depend on their dist output)
        run: npm --prefix packages/shared run build && npm --prefix packages/db run build

      - name: Typecheck — apps/api (source, excludes *.test.ts)
        run: npm --prefix apps/api run typecheck

      # apps/api/tsconfig.json deliberately excludes *.test.ts/*.spec.ts (see
      # README "Piège de typecheck") — only this config catches a type error
      # in a test file. Running both is the whole point of this job existing.
      - name: Typecheck — apps/api tests (tsconfig.test.json)
        run: npx tsc -p apps/api/tsconfig.test.json --noEmit

      - name: Typecheck — apps/web
        run: npm --prefix apps/web run typecheck

      - name: Typecheck — packages/shared, packages/db
        run: npm --prefix packages/shared run typecheck && npm --prefix packages/db run typecheck

      - name: Lint — apps/api
        run: npm --prefix apps/api run lint

      - name: Lint — apps/web
        run: npm --prefix apps/web run lint

      - name: Unit tests — apps/web (node:test)
        run: npm --prefix apps/web test

  api-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: votezpro
          POSTGRES_PASSWORD: votezpro_dev
          POSTGRES_DB: votezpro_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema packages/db/prisma/schema.prisma

      # Mirrors apps/api/package.json's "test" script exactly (build:deps +
      # tsc -p tsconfig.test.json + migrate + run) so CI never drifts from
      # what a developer runs locally.
      - name: Run API test suite (npm test)
        working-directory: apps/api
        run: npm test

      # test:offers lit DATABASE_URL directement (contrairement à `npm test` qui
      # l'exporte lui-même) : sans cette variable l'étape tomberait sur env.ts.
      - name: Run offers module tests (npm run test:offers)
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://votezpro:votezpro_dev@localhost:5433/votezpro_test
        run: npm run test:offers

  # Parcours navigateur (Playwright) : vote, organisateur, admin, et
  # accessibilité des mini-plateformes (axe, WCAG 2.2 AA, 17 styles). Les
  # serveurs API et web sont construits et lancés par playwright.config.ts.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: votezpro
          POSTGRES_PASSWORD: votezpro_dev
          POSTGRES_DB: votezpro_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema packages/db/prisma/schema.prisma

      - name: Install Chromium for Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite (Playwright)
        working-directory: apps/web
        env:
          TEST_DATABASE_URL: postgresql://votezpro:votezpro_dev@localhost:5433/votezpro_test
        run: npx playwright test --reporter=line

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7
