name = "votezpro-maintenance-cron"
main = "src/index.ts"
compatibility_date = "2026-07-29"

[observability]
enabled = true
head_sampling_rate = 1

[env.staging]
workers_dev = false

[env.staging.triggers]
# 02:00 daily = retention purge + sweeps; every 5 min = sweeps only
# (reconciliation + close-expired + release-held).
crons = ["0 2 * * *", "*/5 * * * *"]

[env.production]
workers_dev = false

[env.production.triggers]
# 01:00 daily = retention purge + sweeps; every 5 min = sweeps only
# (reconciliation + close-expired + release-held).
crons = ["0 1 * * *", "*/5 * * * *"]
